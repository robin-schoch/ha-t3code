name: "T3 Code Codex"
slug: "t3code_codex"
version: "0.2.6"
description: "Headless T3 Code server for editing Home Assistant from a remote client"
url: "https://github.com/robin-schoch/ha-t3code/tree/main/t3code-codex"
arch:
  - amd64
  - aarch64
startup: application
boot: manual
init: false
stage: experimental
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "T3 Code server for desktop pairing over Tailscale (requires T3 authentication)"
map:
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
  - type: addon_config
    read_only: false
    path: /config
options:
  openai_api_key: ""
  t3code_log_level: "Info"
  remote_url: ""
  server_name: ""
schema:
  openai_api_key: "password?"
  t3code_log_level: "list(Trace|Debug|Info|Warn|Error)"
  # Home Assistant's URL validator rejects an empty string, even with '?'.
  # The launcher validates non-empty HTTP(S) origins before creating a link.
  remote_url: "str?"
  server_name: "str?"
